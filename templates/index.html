<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f0f4ff; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; color: white; }
    .header h1 { font-size: 2rem; font-weight: 700; }
    .header p { opacity: 0.85; margin-top: 6px; }
    .stats { display: flex; gap: 16px; justify-content: center; padding: 24px; flex-wrap: wrap; }
    .stat-card { background: white; border-radius: 12px; padding: 20px 32px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: #667eea; }
    .stat-card .label { color: #888; font-size: 0.85rem; margin-top: 4px; }
    .container { max-width: 900px; margin: 0 auto; padding: 0 24px 40px; }
    .form-card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .form-card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 18px; color: #333; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: #555; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    .form-group input:focus { border-color: #667eea; }
    .btn-add { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
    .btn-add:hover { opacity: 0.9; }
    .search-bar { background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; display: flex; gap: 12px; }
    .search-bar input { flex: 1; padding: 8px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .search-bar input:focus { border-color: #667eea; }
    table { width: 100%; background: white; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); border-collapse: collapse; overflow: hidden; }
    thead { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    thead th { padding: 14px 18px; text-align: left; font-weight: 600; font-size: 0.9rem; }
    tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
    tbody tr:hover { background: #f8f6ff; }
    tbody td { padding: 14px 18px; font-size: 0.92rem; color: #333; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
    .badge-active { background: #e8f5e9; color: #2e7d32; }
    .btn-del { background: #fff0f0; color: #e53935; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.2s; }
    .btn-del:hover { background: #ffcdd2; }
    .empty { text-align: center; padding: 48px; color: #aaa; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #323232; color: white; padding: 12px 20px; border-radius: 10px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; }
    @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="header">
  <h1>🎓 Student Management System</h1>
  <p>Manage your students easily and efficiently</p>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="num" id="total-count">0</div>
    <div class="label">Total Students</div>
  </div>
</div>

<div class="container">
  <div class="form-card">
    <h2>➕ Add New Student</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Student Name</label>
        <input id="name" placeholder="e.g. Ali Ahmed">
      </div>
      <div class="form-group">
        <label>Roll Number</label>
        <input id="roll" placeholder="e.g. CS-101">
      </div>
      <div class="form-group">
        <label>Grade</label>
        <input id="grade" placeholder="e.g. A">
      </div>
      <button class="btn-add" onclick="addStudent()">Add Student</button>
    </div>
  </div>

  <div class="search-bar">
    <input id="search" placeholder="🔍 Search by name or roll number..." oninput="filterStudents()">
  </div>

  <table id="student-table">
    <thead>
      <tr>
        <th>#</th><th>Name</th><th>Roll No</th><th>Grade</th><th>Status</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
  function getStudents() {
    try { return JSON.parse(localStorage.getItem('students') || '[]'); }
    catch { return []; }
  }
  function saveStudents(arr) {
    localStorage.setItem('students', JSON.stringify(arr));
  }
  function renderTable(list) {
    const tbody = document.getElementById('tbody');
    if (!list || list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No students yet. Add your first student above!</td></tr>';
      document.getElementById('total-count').textContent = 0;
      return;
    }
    tbody.innerHTML = list.map((s, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${s.name}</strong></td>
        <td>${s.roll}</td>
        <td>${s.grade || '-'}</td>
        <td><span class="badge badge-active">Active</span></td>
        <td><button class="btn-del" onclick="deleteStudent('${s.roll}')">🗑 Delete</button></td>
      </tr>
    `).join('');
    document.getElementById('total-count').textContent = list.length;
  }
  function addStudent() {
    const name  = document.getElementById('name').value.trim();
    const roll  = document.getElementById('roll').value.trim();
    const grade = document.getElementById('grade').value.trim();
    if (!name || !roll) { showToast('⚠️ Name aur Roll Number zaroori hai!'); return; }
    const students = getStudents();
    if (students.some(s => s.roll === roll)) { showToast('⚠️ Yeh Roll Number pehle se hai!'); return; }
    students.push({ name, roll, grade });
    saveStudents(students);
    renderTable(students);
    document.getElementById('name').value = '';
    document.getElementById('roll').value = '';
    document.getElementById('grade').value = '';
    showToast('✅ Student add ho gaya!');
  }
  function deleteStudent(roll) {
    if (!confirm('Is student ko delete karna chahte ho?')) return;
    const updated = getStudents().filter(s => s.roll !== roll);
    saveStudents(updated);
    renderTable(updated);
    showToast('🗑 Student delete ho gaya!');
  }
  function filterStudents() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = getStudents().filter(s =>
      s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q)
    );
    renderTable(filtered);
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
  renderTable(getStudents());
</script>
</body>
</html>
